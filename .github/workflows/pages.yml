# Publishes the site to GitHub Pages from main, then checks the deployed site.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job installs npm packages, so it gets read access only; the rights to deploy belong
# to the deploy job alone.
permissions:
  contents: read

# One deploy at a time; a running deploy is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      # base_path is "/boh" for a project site and "" for a user site.
      # Client ids come from web/boh.config.json, or from repository variables (Settings >
      # Secrets and variables > Actions > Variables) when set. They are public, not secrets.
      - run: node scripts/build-site.mjs site --base "${{ steps.pages.outputs.base_path }}/"
        env:
          BOH_GOOGLE_CLIENT_ID: ${{ vars.BOH_GOOGLE_CLIENT_ID }}
          BOH_GOOGLE_API_KEY: ${{ vars.BOH_GOOGLE_API_KEY }}
          BOH_GOOGLE_APP_ID: ${{ vars.BOH_GOOGLE_APP_ID }}
          BOH_DROPBOX_APP_KEY: ${{ vars.BOH_DROPBOX_APP_KEY }}
          BOH_MS_CLIENT_ID: ${{ vars.BOH_MS_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # The deploy can take a moment to reach every edge: try for a few minutes.
      - run: |
          for attempt in 1 2 3 4 5 6; do
            node scripts/smoke-site.mjs "${{ needs.deploy.outputs.page_url }}" && exit 0
            echo "attempt $attempt failed; waiting"
            sleep 20
          done
          exit 1
